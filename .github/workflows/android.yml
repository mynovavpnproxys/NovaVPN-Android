name: Build NovaVPN

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.7'
          channel: stable

      - name: Create Flutter project
        run: flutter create --project-name novavpn --org com.novavpn .

        - name: Generate Android project
          run: flutter create --project-name novavpn --org com.novavpn --platforms android .
      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release
